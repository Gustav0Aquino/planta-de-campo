<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2a">
<title>Planta de Campo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f2238;color:#e8eef5;font:16px/1.45 system-ui,Arial,sans-serif}
.tela{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
[hidden]{display:none!important}
h1{font-size:26px;margin:10px 0 4px}
.sub{color:#aab8c6;margin:0 0 22px;max-width:420px}
.bt{display:block;width:100%;max-width:420px;min-height:58px;border:0;border-radius:12px;font:800 18px system-ui;color:#fff;background:#1a8a3c;margin:8px 0}
.bt.sec{background:#2a4a6e}
.obra{display:block;width:100%;max-width:520px;text-align:left;background:#14324f;border:1px solid #2f6099;border-radius:12px;padding:14px 16px;margin:8px 0;color:#e8eef5;font:600 17px system-ui}
.obra small{display:block;color:#aab8c6;font-weight:400;font-size:14px;margin-top:3px}
.miudo{color:#7f93a8;font-size:13px;margin-top:18px}
/* faixa da casca acima da planta: nome da obra + trocar de obra (não fica por cima de nada da planta) */
#faixa-obra{position:fixed;left:0;right:0;top:0;height:calc(34px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0 12px;
  display:flex;align-items:center;gap:10px;background:#0b1a2b;color:#cfe0f0;font:600 13px system-ui;z-index:5}
#faixa-obra[hidden]{display:none}
#faixa-obra span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#faixa-obra button{height:26px;border:1px solid #2f6099;border-radius:13px;background:#14324f;color:#e8eef5;font:700 12.5px system-ui;padding:0 12px;white-space:nowrap}
#planta{position:fixed;left:0;right:0;bottom:0;top:calc(34px + env(safe-area-inset-top,0px));width:100%;height:calc(100% - 34px - env(safe-area-inset-top,0px));border:0;background:#fff}
.obra.atual{border-color:#4cc277}
#aviso{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:10;width:min(94vw,520px);
  background:#0f2742;color:#fff;border:2px solid #2f6099;border-radius:12px;padding:12px 14px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#aviso[hidden]{display:none}
#aviso.ok{border-color:#1a8a3c}#aviso.erro{border-color:#d84a3a}
#aviso .barra{height:8px;background:#23415f;border-radius:4px;margin-top:8px;overflow:hidden}
#aviso .barra i{display:block;height:100%;background:#4cc277;width:0}
#aviso button{margin-top:10px;min-height:44px;border:0;border-radius:9px;padding:0 14px;font:700 15px system-ui;background:#2a4a6e;color:#fff}
#aviso button.g{background:#1a8a3c}
</style>
</head><body>
<section class="tela" id="t-entrar" hidden>
  <img src="icone-192.png" width="84" height="84" alt="">
  <h1>Planta de Campo</h1>
  <p class="sub">Entre com a sua conta Montaggio. É uma vez só: depois o app abre direto na sua obra, com ou sem sinal.</p>
  <button class="bt" id="b-entrar">Entrar com a conta Montaggio</button>
  <div class="miudo" id="versao"></div>
</section>
<section class="tela" id="t-obras" hidden>
  <h1>Escolha a obra</h1>
  <p class="sub" id="quem"></p>
  <div id="lista-obras" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  <button class="bt sec" id="b-sair" style="margin-top:22px">Sair desta conta</button>
  <div class="miudo" id="versao2"></div>
</section>
<section class="tela" id="t-msg" hidden>
  <h1 id="msg-tit">Carregando…</h1>
  <p class="sub" id="msg-txt"></p>
  <button class="bt sec" id="msg-bt" hidden>Tentar de novo</button>
</section>
<div id="faixa-obra" hidden><span id="faixa-nome"></span><button id="b-trocar">Trocar obra</button></div>
<iframe id="planta" hidden title="Planta"></iframe>
<div id="aviso" hidden></div>
<script src="vendor/msal-browser-4.28.1.min.js"></script>
<script src="app.js?v=0.1.5"></script>
</body></html>
